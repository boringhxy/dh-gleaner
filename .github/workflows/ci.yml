name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # 三个平台统一用 bash：不写的话 Windows 上是 cmd，`run: |` 的多行脚本会逐行
    # 当成独立命令执行，同一份安装步骤在两个平台上行为不同。
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev and mcp extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests
        run: python -B -m unittest discover -s tests -v

  build:
    name: build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify wheel ships defaults and mcp subpackage
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "dhgleaner/defaults/config.json",
              "dhgleaner/defaults/config.local.example.json",
              "dhgleaner/mcp/server.py",
          ]
          missing = [name for name in required if name not in names]
          if missing:
              raise SystemExit(f"wheel is missing: {missing}")
          if any(name.startswith("product_specs/") for name in names):
              raise SystemExit("internal docs leaked into the wheel")
          print(f"{wheel}: {len(names)} files, all required paths present")
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
