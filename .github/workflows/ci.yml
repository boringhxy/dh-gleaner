name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # 三个平台统一用 bash：不写的话 Windows 上是 cmd，`run: |` 的多行脚本会逐行
    # 当成独立命令执行，同一份安装步骤在两个平台上行为不同。
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv (test deps come from uv.lock)
        run: python -m pip install --upgrade pip uv

      # --locked：pyproject 改了而 uv.lock 没跟着更新时，这一步直接报错而非
      # 静默重解——小票不会悄悄过期，这正是当初「不加 lockfile」担心的腐烂。
      # 端到端安装路径（pipx / uv tool install git+…）不吃 lockfile，仍由
      # build job 的 sdist/wheel 冒烟覆盖。
      - name: Sync locked dev environment
        run: |
          uv venv .venv --python "${{ matrix.python-version }}"
          uv sync --locked --extra dev --extra mcp

      - name: Lint (ruff)
        run: uv run --no-sync ruff check .

      - name: Unit tests
        run: uv run --no-sync python -B -m unittest discover -s tests -v

  build:
    name: build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify wheel ships defaults and mcp subpackage
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "dhgleaner/defaults/config.json",
              "dhgleaner/defaults/config.local.example.json",
              "dhgleaner/mcp/server.py",
          ]
          missing = [name for name in required if name not in names]
          if missing:
              raise SystemExit(f"wheel is missing: {missing}")
          if any(name.startswith("product_specs/") for name in names):
              raise SystemExit("internal docs leaked into the wheel")
          print(f"{wheel}: {len(names)} files, all required paths present")
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
