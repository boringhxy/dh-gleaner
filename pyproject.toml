[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dh-journal-agent"
version = "0.1.0"
description = "按刊按期巡检中文期刊目录页，人工筛选后再写入 Zotero 的文献采集工具"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Hu Xiaoyu", email = "boringhxy@163.com" }]
keywords = ["digital-humanities", "zotero", "journal-toc", "chinese-journals", "literature-review"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: HTML",
  "Topic :: Sociology",
]
dependencies = [
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=4.9.0",
  "pyzotero>=1.5.0",
]

[project.optional-dependencies]
# 下界必须是 2.0.0：MCP 层用的是 `mcp.server.mcpserver.MCPServer`（2.0.0 才引入），
# 1.x 的 mcp.server 下只有 fastmcp/，装上了也会 ImportError。
mcp = ["mcp>=2.0.0"]
dev = ["ruff>=0.6.0"]

[project.scripts]
dhjournal = "dhjournal.cli:main"
dhjournal-mcp = "dhjournal.mcp.server:main"

[project.urls]
Homepage = "https://github.com/boringhxy/dh-journal-agent"
Repository = "https://github.com/boringhxy/dh-journal-agent"
Issues = "https://github.com/boringhxy/dh-journal-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["dhjournal"]

[tool.hatch.build.targets.sdist]
include = [
  "dhjournal",
  "tests",
  "docs",
  "main.py",
  "config.local.example.json",
  "README.md",
  "README.en.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "logs", "tmp", ".venv"]

[tool.ruff.lint]
# 只拦「真问题」：未使用/未定义名字、import 顺序、常见陷阱、以及 print 的越界使用。
# 暂不启用 UP（typing 现代化）与 E501（行宽）——这两类属于历史代码的格式清扫，
# 会波及所有文件，留待专门一轮统一处理，不混进结构性重构。
select = ["F", "B", "E", "W", "I", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 终端界面本来就是用来 print 的；MCP 层（未被豁免）一律禁止 print，
# 因为 MCP 用 stdout 传 JSON-RPC，一行 print 就会损坏协议。
"dhjournal/cli.py" = ["T201"]
"dhjournal/logging_setup.py" = ["T201"]
"tests/*" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["dhjournal"]
