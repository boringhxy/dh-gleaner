[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dh-gleaner"
dynamic = ["version"]
description = "按刊按期巡检中文期刊目录页，人工筛选后再写入 Zotero 的文献采集工具"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Hu Xiaoyu", email = "boringhxy@163.com" }]
keywords = ["digital-humanities", "zotero", "journal-toc", "chinese-journals", "literature-review"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: HTML",
  "Topic :: Sociology",
]
# 上界只封到下一个 major：这些库的 minor 版本会加功能但基本不破接口，封到 major
# 就够挡住「某天 pipx 重装时自动升到一个没测过的接口」这类事故。上界必须容得下
# 当前已验证的组合（requests 2.34 / bs4 4.15 / lxml 6.1 / pyzotero 1.16 / mcp 2.3）。
dependencies = [
  "requests>=2.31.0,<3",
  "beautifulsoup4>=4.12.0,<5",
  "lxml>=4.9.0,<7",
  "pyzotero>=1.5.0,<2",
]

[project.optional-dependencies]
# 下界必须是 2.0.0：MCP 层用的是 `mcp.server.mcpserver.MCPServer`（2.0.0 才引入），
# 1.x 的 mcp.server 下只有 fastmcp/，装上了也会 ImportError。
mcp = ["mcp>=2.0.0,<3"]
dev = ["ruff>=0.6.0"]

[project.scripts]
dhgleaner = "dhgleaner.cli:main"
dhgleaner-mcp = "dhgleaner.mcp.server:main"

[project.urls]
Homepage = "https://github.com/boringhxy/dh-gleaner"
Repository = "https://github.com/boringhxy/dh-gleaner"
Issues = "https://github.com/boringhxy/dh-gleaner/issues"

[tool.hatch.version]
# 版本号只有 `dhgleaner/__init__.py` 一处：`dhgleaner --version`、MCP 的
# serverInfo 与打包元数据都读它，改两处迟早会不一致。
path = "dhgleaner/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["dhgleaner"]

[tool.hatch.build.targets.sdist]
include = [
  "dhgleaner",
  "tests",
  "docs",
  "main.py",
  "README.md",
  "README.en.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "logs", "tmp", ".venv"]

[tool.ruff.lint]
# 只拦「真问题」：未使用/未定义名字、import 顺序、常见陷阱、以及 print 的越界使用。
# 暂不启用 UP（typing 现代化）与 E501（行宽）——这两类属于历史代码的格式清扫，
# 会波及所有文件，留待专门一轮统一处理，不混进结构性重构。
select = ["F", "B", "E", "W", "I", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 终端界面本来就是用来 print 的；MCP 层（未被豁免）一律禁止 print，
# 因为 MCP 用 stdout 传 JSON-RPC，一行 print 就会损坏协议。
"dhgleaner/cli.py" = ["T201"]
"dhgleaner/logging_setup.py" = ["T201"]
"tests/*" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["dhgleaner"]
